<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; background: #f6f9fb; color: #0a4d5c; }
        .topbar { background: linear-gradient(135deg, #1a7a8a 0%, #2eb8b8 100%); color: white; }
        .container { max-width: 1100px; margin: 0 auto; padding: 16px; }
        .nav { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
        .brand { display: flex; align-items: center; gap: 12px; font-weight: 700; }
        .brand img { height: 36px; width: 36px; border-radius: 50%; background: white; object-fit: contain; }
        .links { display: flex; align-items: center; gap: 12px; }
        .link { color: white; text-decoration: none; font-weight: 600; padding: 8px 12px; border-radius: 8px; border: 2px solid rgba(255,255,255,0.3); }
        .link:hover { background: rgba(255,255,255,0.12); }
        .link.primary { background: white; color: #1a7a8a; border-color: white; }
        main { padding: 24px 0; }
        footer { padding: 24px 0; color: #4e5d66; font-size: 14px; text-align: center; }
        @media (max-width: 640px) { .links { gap: 8px; } .brand span { display: none; } }
    </style>
    {{ head }}
    <!-- Logo note: using website/static logo path if served; adjust if different in app -->
</head>
<body>
    <header class="topbar">
        <div class="container nav">
            <div class="brand">
                <img src="/img/logo.png" alt="Dolphin" onerror="this.src='/images/logo.png'">
                <span>Dolphin Auth</span>
            </div>
            @include('partials.auth_nav')
        </div>
    </header>
    <main class="container">
        {{ yield }}
    </main>
    <footer>
        <div class="container">Powered by Dolphin Framework • Secure • Fast • Reliable</div>
    </footer>
    {{ scripts }}
</body>
</html>
