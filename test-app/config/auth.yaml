# Authentication Configuration
auth:
  # Session configuration
  session:
    driver: "cookie"  # cookie, redis, database
    lifetime: 120     # minutes
    encrypt: true
    same_site: "lax"
    
  # Password reset configuration
  password_reset:
    expires_in: 60    # minutes
    throttle: 60      # seconds between requests
    
  # Email verification
  email_verification:
    expires_in: 60    # minutes
    throttle: 60      # seconds between requests
    
  # Remember me functionality
  remember_me:
    enabled: true
    lifetime: 10080  # minutes (7 days)
    
  # Login throttling
  login_throttle:
    max_attempts: 5
    decay_minutes: 15
    
  # Registration
  registration:
    enabled: true
    require_email_verification: true
    require_terms_acceptance: true
