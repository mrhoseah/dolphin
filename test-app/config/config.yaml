server:
  port: 8080
  read_timeout: 30
  write_timeout: 30
  idle_timeout: 120

database:
  driver: "sqlite"
  host: "localhost"
  port: 3306
  database: "dolphin.db"
  username: ""
  password: ""
  charset: "utf8mb4"
  parse_time: true
  loc: "Local"
  max_open_conns: 100
  max_idle_conns: 10
  conn_max_lifetime: 3600

jwt:
  secret: "your-secret-key-change-this-in-production"
  expires_in: 24

cache:
  driver: "memory"
  redis:
    host: "localhost"
    port: 6379
    password: ""
    db: 0

session:
  driver: "cookie"
  lifetime: 120
  encrypt: true
  same_site: "lax"

log:
  level: "info"
  format: "json"
